<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Паспорт</title>
    <style type="text/css">
        body {
            background-image: url('images/pass.jpg'); 
            background-position: left 265px;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
        }
        
        .fam { margin-left: 150px; margin-top: 293px; font-weight: bold;}
        .imya { margin-left: 140px; margin-top: 22px;}
        .otc { margin-left: 150px; margin-top: 3px;}
        .sex { margin-left: 145px; margin-top: 2px;}
        .date { margin-left: 90px; margin-top: 2px;}
        
        .img { margin-left: 10px; margin-top: -70px;}
        
        .button { margin-left: 10px; margin-top: 120px; padding: 5px 15px; cursor: pointer;}
        
        .sex, .date {
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>Паспорт</h1>
    <ul>
        <li> <a href='index.html'>Главная страница</a> </li>
        <li> <a href='info.html'>Учебные материалы (Главы)</a> </li>
        <li> <a href='test_img.html'>Фотогалерея</a> </li>
        <li> <a href="form.html">Анкета студента (Форма)</a> </li>
        <li> <a href='passport.html' class="active">Студенческий билет (Паспорт)</a> </li>
        <li> <a href='table.html'>Расписание (Таблица)</a> </li>
        <li> <a href='task.html'>Лабораторная работа (Задача)</a> </li>
        <li> <a href='DOM.html'>Считывание из DOM</a> </li>
        <li> <a href="https://www.hse.ru/" target="_blank">Сайт универа (Внешний)</a> </li>
        <li> <a href="https://www.hse.ru/" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" width="20px" alt="Домой" /></a></li>
    </ul>

    <div class="fam" id="fam">Бровко</div>
    <div class="imya" id="nam">Мария</div>
    <div class="otc" id="otch">Александровна</div>
    
    <div class="sex"><span id="gender">Жен</span></div>
    <div class="date"><span id="date">27/05/2007</span></div>

    <div class="img"> 
        <img src="images/photo.jpg" height="110" width="100" alt="Фото"> 
    </div>

    <button class="button" id="change">Заменить</button>

    <script>
        window.onload = function() {
            let allDivs = document.getElementsByTagName('div');
            if(allDivs.length >= 4) {
                let lastName = allDivs[0].innerText;
                let firstName = allDivs[1].innerText;
                let birthDate = document.getElementById('date').innerText;
                console.log("Считано из DOM: " + lastName + " " + firstName + ", " + birthDate);
            }

            let isLatin = false;
            document.getElementById('change').addEventListener('click', function() {
                let famEl = document.getElementById('fam');
                let namEl = document.getElementById('nam');
                let otchEl = document.getElementById('otch');
                let genEl = document.getElementById('gender');

                if (!isLatin) {
                    famEl.innerText = "Brovko";
                    namEl.innerText = "Maria";
                    otchEl.innerText = "Alexandrovna";
                    genEl.innerText = "Female";
                    this.innerText = "Вернуть";
                    isLatin = true;
                } else {
                    famEl.innerText = "Бровко";
                    namEl.innerText = "Мария";
                    otchEl.innerText = "Александровна";
                    genEl.innerText = "Жен";
                    this.innerText = "Заменить";
                    isLatin = false;
                }
            });
        };
    </script>

</body>
</html>
