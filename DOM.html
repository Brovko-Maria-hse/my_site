<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Паспорт студента</title>
    <style>
        body {
            background-image: url('pasport_shablon.png'); 
            background-position: left top;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
        }

        .fio { margin-left: 150px; margin-top: 340px; font-weight: bold; font-size: 18px;}
        .name { margin-left: 150px; margin-top: 20px; font-size: 16px;}
        .s_name { margin-left: 150px; margin-top: 10px; font-size: 16px;}
        .data_b { margin-left: 150px; margin-top: 5px; font-size: 16px;}
        
        .img { margin-left: 30px; margin-top: -70px; }
        
        .btn { margin-left: 30px; margin-top: 70px; padding: 5px 15px; cursor: pointer;}

        .result-box { 
            margin-top: 50px; 
            margin-left: 30px; 
            padding: 15px; 
            border: 2px solid #333; 
            width: 400px; 
            background: #fff;
        }
    </style>
</head>
<body>

    <div class="fio" id="fam">Бровко</div>
    <div class="name" id="nam">Мария</div>
    <div class="s_name" id="otch">Александровна</div>
    
    <div class="data_b"> 
        <span id="gender">ЖЕН</span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 
        <span id="date">27/05/2005</span> 
    </div>

    <div class="img"> <img src="men.jpg" height="120" width="100" alt="Фото"> </div>

    <button class="btn" id="change">Заменить</button>

    <script>
window.onload = function() {
    
    let allDivs = document.getElementsByTagName('div');
    
    let lastName = allDivs[0].innerText;
    let firstName = allDivs[1].innerText;
    let birthYear = allDivs[3].getElementsByTagName('span')[1].innerText;

    document.getElementById('change').addEventListener('click', function() {
        document.getElementById('fam').innerText = "Brovko";
        document.getElementById('nam').innerText = "Maria";
        document.getElementById('otch').innerText = "Alexandrovna";
        document.getElementById('gender').innerText = "FEMALE";
        document.getElementById('date').innerText = "27/05/2005"; 
    });
};
</script>
</body>
</html>
