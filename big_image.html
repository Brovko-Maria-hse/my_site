<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Большая фотокарточка</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center; 
            align-items: center;     
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
        }
        img {
            width: 600px;
            height: 400px;
            border: 3px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/desk_big.jpg" alt="Большое фото">
        <p>Мой рабочий стол (600x400)</p>
    </div>
</body>
</html>
